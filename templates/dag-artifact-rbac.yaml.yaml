{{- if .Values.dagArtifact.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "airflow-wrapper.fullname" . }}-dag-artifact

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "airflow-wrapper.fullname" . }}-dag-artifact
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get","create","update","patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "airflow-wrapper.fullname" . }}-dag-artifact
subjects:
  - kind: ServiceAccount
    name: {{ include "airflow-wrapper.fullname" . }}-dag-artifact
roleRef:
  kind: Role
  name: {{ include "airflow-wrapper.fullname" . }}-dag-artifact
  apiGroup: rbac.authorization.k8s.io
{{- end }}
