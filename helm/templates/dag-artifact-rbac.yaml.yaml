{{- if .Values.dagArtifact.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-airflow-dag-artifact
  namespace: airflow

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sync-airflow-dag-artifact
  namespace: airflow
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get","create","update","patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sync-airflow-dag-artifact
  namespace: airflow
subjects:
  - kind: ServiceAccount
    name: sync-airflow-dag-artifact
    namespace: airflow
roleRef:
  kind: Role
  name: sync-airflow-dag-artifact
  apiGroup: rbac.authorization.k8s.io
{{- end }}
