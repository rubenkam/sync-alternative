{{- if .Values.dagArtifact.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-dag-artifact-{{ .Values.dagArtifact.version | replace "." "-" }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: dag-artifact-builder
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              set -euo pipefail

              echo "Cloning DAG repository..."
              git clone --branch {{ .Values.dagArtifact.branch }} {{ .Values.dagArtifact.repo }} /repo
              cd /repo

              echo "Checking out tag {{ .Values.dagArtifact.version }}..."
              git fetch --tags
              git checkout {{ .Values.dagArtifact.version }}

              echo "Cleaning existing DAGs in PVC"
              # Remove old .py files but keep the mount root
              find /artifact -maxdepth 1 -type f -name "*.py" -exec rm -f {} \;

              echo "Copying DAGs directly into PVC root"
              find {{ .Values.dagArtifact.subPath }} -type f -name "*.py" -exec cp {} /artifact/ \;

              chown airflow: /artifact/*.py
              chmod 644 /artifact/*.py

              echo "DAG artifact update complete."

          volumeMounts:
            - name: dag-artifact
              mountPath: /artifact

      volumes:
        - name: dag-artifact
          persistentVolumeClaim:
            claimName: {{ .Values.dagArtifact.pvc.name }}
{{- end }}
