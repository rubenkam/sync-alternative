############################################################
# DAG Artifact Distribution (Phase 2 - PVC Based)
############################################################

dagArtifact:
  enabled: true

  repo: https://github.com/rubenkam/sync-alternative
  branch: dags
  version: v1.0.0   # Git tag to deploy

  pvc:
    name: airflow-dag-artifact-pvc
    size: 1Gi
    storageClassName: standard


############################################################
# Apache Airflow Configuration
############################################################

airflow:

  useStandardNaming: true
  executor: KubernetesExecutor

  config:
    core:
      dags_folder: /opt/airflow/dags
      store_serialized_dags: True

  secrets:
    fernetKey:
      create: true

  postgresql:
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: latest

  dags:
    persistence:
      enabled: false
    gitSync:
      enabled: false

  scheduler:
    extraVolumes:
      - name: dag-artifact
        persistentVolumeClaim:
          claimName: airflow-dag-artifact-pvc
      - name: dags
        emptyDir: {} 

    extraVolumeMounts:
      - name: dag-artifact
        mountPath: /opt/airflow/dags
      - name: dags
        mountPath: /opt/airflow/dags

    podAnnotations:
      dag-version: "{{ .Values.dagArtifact.version }}"

    extraInitContainers:
      - name: copy-dags-to-airflow
        image: alpine:latest
        command:
          - sh
          - -c
          - |
            echo "Copying DAGs from PVC to /opt/airflow/dags..."
            cp /artifact/*.py /opt/airflow/dags/
        volumeMounts:
          - name: dag-artifact
            mountPath: /artifact
          - name: dags
            mountPath: /opt/airflow/dags
        securityContext:
          runAsUser: 50000   # Airflow user UID in most images
          runAsGroup: 50000

  workers:
    extraVolumes:
      - name: dag-artifact
        persistentVolumeClaim:
          claimName: airflow-dag-artifact-pvc

    extraVolumeMounts:
      - name: dag-artifact
        mountPath: /opt/airflow/dags
