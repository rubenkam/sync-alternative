############################################################
# DAG Artifact Distribution (RWO Compatible)
############################################################

dagArtifact:
  enabled: true

  repo: https://github.com/rubenkam/sync-alternative
  commit: main
  subPath: dags

  artifact:
    type: configmap   # phase 1 implementation
    name: airflow-dag-artifact

  job:
    image: alpine/git:latest
    imagePullPolicy: IfNotPresent

############################################################
# Apache Airflow Chart Configuration
############################################################

airflow:

  useStandardNaming: true

  executor: KubernetesExecutor

  postgresql:
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: latest

  dags:
    persistence:
      enabled: false   # IMPORTANT: no PVC in RWO setup

    gitSync:
      enabled: false

  config:
    core:
      dags_folder: /opt/airflow/dags

  # This injects DAGs into all pods
  extraVolumes:
    - name: dags
      emptyDir: {}

    - name: dag-artifact
      configMap:
        name: airflow-dag-artifact

  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags

  extraInitContainers:
    - name: extract-dags
      image: alpine:latest
      command:
        - sh
        - -c
        - |
          mkdir -p /opt/airflow/dags
          cp -r /artifact/* /opt/airflow/dags/
      volumeMounts:
        - name: dags
          mountPath: /opt/airflow/dags
        - name: dag-artifact
          mountPath: /artifact

  triggerer:
    persistence:
      enabled: true

  logs:
    persistence:
      enabled: false
      size: 10Gi
      storageClassName: standard

  createUserJob:
    useHelmHooks: false

  migrateDatabaseJob:
    useHelmHooks: false
