############################################################
# DAG Artifact Distribution (RWO Compatible)
############################################################

dagArtifact:
  enabled: true

  repo: https://github.com/rubenkam/sync-alternative
  commit: main
  subPath: dags

  artifact:
    type: configmap   # phase 1 implementation
    name: airflow-dag-artifact

  job:
    image: alpine/k8s:1.29.2
    imagePullPolicy: IfNotPresent
    # Robust DAG extraction inside the job
    command: |
      set -e
      echo "Cloning DAG repo..."
      git clone {{ .Values.dagArtifact.repo }} /repo
      cd /repo
      git checkout {{ .Values.dagArtifact.commit }}
      mkdir -p /workspace/dags
      echo "Copying all python files from subPath..."
      find {{ .Values.dagArtifact.subPath }} -name "*.py" -exec cp {} /workspace/dags/ \;
      echo "Creating ConfigMap artifact..."
      kubectl create configmap {{ .Values.dagArtifact.artifact.name }} \
        --from-file=/workspace/dags/ \
        --dry-run=client -o yaml | kubectl apply -f -

############################################################
# Apache Airflow Chart Configuration
############################################################

airflow:

  useStandardNaming: true

  executor: KubernetesExecutor

  secrets:
    fernetKey:
      create: true

  postgresql:
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: latest

  dags:
    persistence:
      enabled: false   # IMPORTANT: no PVC in RWO setup
    gitSync:
      enabled: false

  config:
    core:
      dags_folder: /opt/airflow/dags
      store_serialized_dags: True

  triggerer:
    persistence:
      enabled: true

  logs:
    persistence:
      enabled: false
      size: 10Gi
      storageClassName: standard

  createUserJob:
    useHelmHooks: false

  migrateDatabaseJob:
    useHelmHooks: false

  scheduler:
    extraVolumes:
      - name: dags
        emptyDir: {}
      - name: dag-artifact
        configMap:
          name: airflow-dag-artifact

    extraVolumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags
      - name: dag-artifact
        mountPath: /artifact

    extraInitContainers:
      - name: extract-dags
        image: alpine:latest
        command:
          - sh
          - -c
          - |
            echo "Extracting DAGs from ConfigMap..."
            mkdir -p /opt/airflow/dags
            for f in /artifact/*; do
              if [ -f "$f" ] && echo "$f" | grep -qE "\.py$"; then
                echo "Copying $f to /opt/airflow/dags"
                cp -L "$f" /opt/airflow/dags/
              fi
            done
            echo "DAGs copied to /opt/airflow/dags"
        volumeMounts:
          - name: dags
            mountPath: /opt/airflow/dags
          - name: dag-artifact
            mountPath: /artifact

